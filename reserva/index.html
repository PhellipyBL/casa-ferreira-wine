  <div id="root" class="msg">Carregando reserva…</div>

      location.replace(dest);

      document.getElementById('root').innerHTML =
        'Link incompleto. Use o link específico da data que você recebeu, ou fale com a gente no <a href="https://wa.me/5583996790368">WhatsApp oficial</a>.';
