<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Check-in QR · Casa Ferreira Wine</title>
<style>
  :root{ --vinho:#5C1A1A; --vinho2:#3D0F0F; --areia:#F7F3EC; --ouro:#D4B07A; --verde:#2E7D32; --amarelo:#F9A825; --vermelho:#C62828; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif; background:var(--areia); color:#1C1C1C; }
  .hd{ background:var(--vinho2); color:var(--areia); padding:16px; text-align:center; }
  .hd .b{ font-family:Georgia,serif; letter-spacing:.14em; font-size:18px; }
  .hd .g{ color:var(--ouro); }
  .hd .d{ color:var(--ouro); font-size:12px; margin-top:4px; letter-spacing:.1em; text-transform:uppercase; }
  .wrap{ max-width:520px; margin:0 auto; padding:14px; }
  .scanbox{ position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:16px; background:#111; }
  .scanbox video{ width:100%; height:100%; object-fit:cover; }
  .reticle{ position:absolute; inset:12%; border:3px solid var(--ouro); border-radius:14px; box-shadow:0 0 0 9999px rgba(0,0,0,.32); pointer-events:none; }
  .msg{ text-align:center; font-size:17px; font-weight:600; min-height:54px; margin:16px 8px; line-height:1.4; }
  .msg.ok{ color:var(--verde); } .msg.warn{ color:var(--amarelo); } .msg.err{ color:var(--vermelho); }
  .nome{ font-size:22px; font-weight:700; text-align:center; margin-top:4px; }
  .btn{ display:block; width:100%; padding:16px; border:none; border-radius:10px; background:var(--vinho); color:#fff; font-size:17px; font-weight:bold; margin-top:8px; }
  .hint{ text-align:center; font-size:12px; color:#9a8f86; margin:10px 12px; }
  .start{ display:flex; align-items:center; justify-content:center; gap:10px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
  <div class="hd">
    <div class="b">CASA FERREIRA <span class="g">WINE</span></div>
    <div class="d">Check-in por QR</div>
  </div>
  <div class="wrap">
    <div class="scanbox"><video id="vid" playsinline muted></video><div class="reticle"></div></div>
    <div class="msg" id="msg">Toque em iniciar para abrir a câmera</div>
    <div class="nome" id="nome"></div>
    <button class="btn start" id="btn" onclick="start()">📷 Iniciar câmera</button>
    <div class="hint">Aponte para o QR do e-ticket do convidado. A presença é marcada sozinha.</div>
  </div>

<script>
  // URL do web app (endpoint de marcação). Mesma do sistema de reservas.
  var EXEC = 'https://script.google.com/macros/s/AKfycbxubAQmX2lLmZQFhQeZORppkfK9Xxylm7AOYhjXOJQO2gG5XsXT2RN6b1sCPK978a8h/exec';

  var stream=null, raf=null, detector=null, canv=null, cctx=null, lastCode='', lastT=0, busy=false, actx=null;
  function $(id){ return document.getElementById(id); }
  function setMsg(t,cls){ var m=$('msg'); m.textContent=t; m.className='msg'+(cls?' '+cls:''); }
  function beep(f,d){ try{ if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(actx.destination); g.gain.value=.09; o.start(); setTimeout(function(){o.stop();},d);}catch(e){} }

  function start(){
    $('btn').style.display='none';
    setMsg('Iniciando câmera…','');
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } }).then(function(s){
      stream=s; var v=$('vid'); v.srcObject=s; v.setAttribute('playsinline',''); v.play();
      setMsg('Aponte para o QR do convidado','');
      if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; } }
      tick();
    }).catch(function(err){
      setMsg('Não foi possível abrir a câmera: '+(err && err.name ? err.name : 'erro')+'. Verifique a permissão.','err');
      $('btn').style.display='block';
    });
  }

  function tick(){
    var v=$('vid');
    if(!v.videoWidth){ raf=requestAnimationFrame(tick); return; }
    if(detector){
      detector.detect(v).then(function(codes){ if(codes && codes.length) gotCode(codes[0].rawValue); }).catch(function(){});
    } else if(window.jsQR){
      if(!canv){ canv=document.createElement('canvas'); cctx=canv.getContext('2d'); }
      canv.width=v.videoWidth; canv.height=v.videoHeight;
      cctx.drawImage(v,0,0,canv.width,canv.height);
      try{ var img=cctx.getImageData(0,0,canv.width,canv.height); var c=jsQR(img.data,img.width,img.height); if(c && c.data) gotCode(c.data); }catch(e){}
    }
    raf=requestAnimationFrame(tick);
  }

  // Extrai código (CFW-XXX) e token (t) do conteúdo do QR (que é uma URL ?c=CFW-XXX&t=TOKEN)
  function parseQR(raw){
    raw=(raw||'').toString();
    var cod='', tok='';
    var mc=raw.toUpperCase().match(/CFW-?([0-9]+)/);
    if(mc) cod='CFW-'+mc[1];
    var mt=raw.match(/[?&]t=([^&]+)/);
    if(mt) tok=decodeURIComponent(mt[1]);
    return { cod:cod, tok:tok };
  }

  function gotCode(raw){
    if(busy) return;
    var now=Date.now();
    var p=parseQR(raw);
    if(!p.cod){ return; } // ignora QR que não é da casa
    if(p.cod===lastCode && (now-lastT)<3000) return; // debounce
    lastCode=p.cod; lastT=now;
    if(!p.tok){ setMsg(p.cod+' — QR sem token (e-ticket antigo?)','warn'); beep(440,120); return; }
    busy=true;
    setMsg('Registrando '+p.cod+'…','');
    mark(p.cod, p.tok);
  }

  function mark(cod, tok){
    var cb='cb'+Date.now();
    var s=document.createElement('script');
    var done=false;
    window[cb]=function(res){ done=true; handleResult(res); cleanup(); };
    function cleanup(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); busy=false; }
    s.onerror=function(){ if(!done){ handleResult({ok:false,erro:'rede'}); cleanup(); } };
    setTimeout(function(){ if(!done){ handleResult({ok:false,erro:'timeout'}); cleanup(); } }, 12000);
    s.src=EXEC+'?action=extmark&cod='+encodeURIComponent(cod)+'&tok='+encodeURIComponent(tok)+'&cb='+cb;
    document.body.appendChild(s);
  }

  function handleResult(res){
    $('nome').textContent = res && res.nome ? res.nome : '';
    if(res && res.ok && res.ja){ setMsg('Já estava presente ('+(res.hora||'')+')','warn'); beep(440,90); }
    else if(res && res.ok){ setMsg('✓ Presença registrada · '+(res.hora||''),'ok'); beep(680,140); }
    else {
      var e = res && res.erro;
      var txt = e==='token' ? 'QR inválido' : e==='nao_encontrado' ? 'Reserva não encontrada' : e==='ocupado' ? 'Sistema ocupado, tente de novo' : e==='timeout' ? 'Sem resposta — tente de novo' : 'Falha de conexão';
      setMsg('✗ '+txt,'err'); beep(180,200);
    }
    setTimeout(function(){ setMsg('Aponte para o QR do convidado',''); $('nome').textContent=''; }, 2600);
  }
</script>
</body>
</html>
