<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Check-in QR · Casa Ferreira Wine</title>
<style>
  :root{ --vinho:#5C1A1A; --vinho2:#3D0F0F; --areia:#F7F3EC; --ouro:#D4B07A; --verde:#2E7D32; --amarelo:#F9A825; --vermelho:#C62828; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif; background:var(--areia); color:#1C1C1C; }
  .hd{ background:var(--vinho2); color:var(--areia); padding:16px; text-align:center; }
  .hd .b{ font-family:Georgia,serif; letter-spacing:.14em; font-size:18px; }
  .hd .g{ color:var(--ouro); }
  .hd .d{ color:var(--ouro); font-size:12px; margin-top:4px; letter-spacing:.1em; text-transform:uppercase; }
  .wrap{ max-width:520px; margin:0 auto; padding:14px; }
  .scanbox{ position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:16px; background:#111; }
  .scanbox video{ width:100%; height:100%; object-fit:cover; }
  .reticle{ position:absolute; inset:12%; border:3px solid var(--ouro); border-radius:14px; box-shadow:0 0 0 9999px rgba(0,0,0,.32); pointer-events:none; }
  .msg{ text-align:center; font-size:17px; font-weight:600; min-height:54px; margin:16px 8px; line-height:1.4; }
  .msg.ok{ color:var(--verde); } .msg.warn{ color:var(--amarelo); } .msg.err{ color:var(--vermelho); }
  .btn{ display:block; width:100%; padding:16px; border:none; border-radius:10px; background:var(--vinho); color:#fff; font-size:17px; font-weight:bold; margin-top:8px; }
  .hint{ text-align:center; font-size:12px; color:#9a8f86; margin:10px 12px; }
  .start{ display:flex; align-items:center; justify-content:center; gap:10px; }

  /* Card de resultado (só fecha no OK) */
  .res{ display:none; position:fixed; inset:0; z-index:60; background:var(--areia); flex-direction:column; }
  .res.on{ display:flex; }
  .res__top{ padding:22px 18px 16px; text-align:center; color:#fff; }
  .res__top.ok{ background:var(--verde); } .res__top.warn{ background:var(--amarelo); color:#3D0F0F; } .res__top.err{ background:var(--vermelho); }
  .res__icon{ font-size:46px; line-height:1; }
  .res__status{ font-size:18px; font-weight:700; margin-top:6px; }
  .res__hora{ font-size:13px; opacity:.9; margin-top:2px; }
  .res__body{ flex:1; overflow:auto; padding:22px 20px; }
  .res__nome{ font-size:30px; font-weight:800; text-align:center; line-height:1.15; }
  .res__cod{ text-align:center; color:#9a8f86; font-size:13px; letter-spacing:.08em; margin-top:4px; }
  .row{ display:flex; align-items:center; gap:14px; background:#fff; border-radius:12px; padding:16px; margin-top:14px; }
  .row__ic{ font-size:30px; flex-shrink:0; }
  .row__lb{ font-size:12px; color:#9a8f86; letter-spacing:.08em; text-transform:uppercase; }
  .row__vl{ font-size:22px; font-weight:700; margin-top:2px; }
  .row.sala{ border-left:5px solid var(--ouro); }
  .row.prato{ border-left:5px solid var(--vinho); }
  .row.alergia{ border-left:5px solid var(--vermelho); }
  .row.alergia .row__vl{ color:var(--vermelho); }
  .bday{ display:none; margin:16px 0 2px; padding:16px; border-radius:14px; background:linear-gradient(135deg,#E7C98A,#C99A4E); color:#3D0F0F; text-align:center; font-size:21px; font-weight:800; letter-spacing:.02em; box-shadow:0 3px 14px rgba(0,0,0,.15); }
  .bday.on{ display:block; }
  .res__okwrap{ padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:var(--areia); }
  .res__ok{ display:block; width:100%; padding:20px; border:none; border-radius:12px; background:var(--vinho); color:#fff; font-size:20px; font-weight:800; letter-spacing:.04em; }
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
  <div class="hd">
    <div class="b">CASA FERREIRA <span class="g">WINE</span></div>
    <div class="d">Check-in por QR</div>
  </div>
  <div class="wrap">
    <div class="scanbox"><video id="vid" playsinline muted></video><div class="reticle"></div></div>
    <div class="msg" id="msg">Toque em iniciar para abrir a câmera</div>
    <button class="btn start" id="btn" onclick="start()">📷 Iniciar câmera</button>
    <div class="hint">Aponte para o QR do e-ticket do convidado. Os dados aparecem na tela e a presença é marcada.</div>
  </div>

  <!-- Card de resultado: fica na tela até apertar OK -->
  <div class="res" id="res">
    <div class="res__top" id="resTop">
      <div class="res__icon" id="resIcon">✓</div>
      <div class="res__status" id="resStatus"></div>
      <div class="res__hora" id="resHora"></div>
    </div>
    <div class="res__body">
      <div class="res__nome" id="resNome"></div>
      <div class="res__cod" id="resCod"></div>
      <div class="bday" id="resBday"></div>
      <div id="resRows"></div>
    </div>
    <div class="res__okwrap"><button class="res__ok" onclick="okResult()">OK · próximo</button></div>
  </div>

<script>
  // URL do web app (endpoint de marcação). Mesma do sistema de reservas.
  var EXEC = 'https://script.google.com/macros/s/AKfycbxubAQmX2lLmZQFhQeZORppkfK9Xxylm7AOYhjXOJQO2gG5XsXT2RN6b1sCPK978a8h/exec';

  var stream=null, raf=null, detector=null, canv=null, cctx=null, lastCode='', lastT=0, busy=false, actx=null;
  function $(id){ return document.getElementById(id); }
  function setMsg(t,cls){ var m=$('msg'); m.textContent=t; m.className='msg'+(cls?' '+cls:''); }
  function beep(f,d){ try{ if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(actx.destination); g.gain.value=.09; o.start(); setTimeout(function(){o.stop();},d);}catch(e){} }

  function start(){
    $('btn').style.display='none';
    setMsg('Iniciando câmera…','');
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } }).then(function(s){
      stream=s; var v=$('vid'); v.srcObject=s; v.setAttribute('playsinline',''); v.play();
      setMsg('Aponte para o QR do convidado','');
      if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; } }
      tick();
    }).catch(function(err){
      setMsg('Não foi possível abrir a câmera: '+(err && err.name ? err.name : 'erro')+'. Verifique a permissão.','err');
      $('btn').style.display='block';
    });
  }

  function tick(){
    var v=$('vid');
    if(busy){ return; } // pausado enquanto o card de resultado está aberto
    if(!v.videoWidth){ raf=requestAnimationFrame(tick); return; }
    if(detector){
      detector.detect(v).then(function(codes){ if(codes && codes.length) gotCode(codes[0].rawValue); }).catch(function(){});
    } else if(window.jsQR){
      if(!canv){ canv=document.createElement('canvas'); cctx=canv.getContext('2d'); }
      canv.width=v.videoWidth; canv.height=v.videoHeight;
      cctx.drawImage(v,0,0,canv.width,canv.height);
      try{ var img=cctx.getImageData(0,0,canv.width,canv.height); var c=jsQR(img.data,img.width,img.height); if(c && c.data) gotCode(c.data); }catch(e){}
    }
    raf=requestAnimationFrame(tick);
  }

  // Extrai código (CFW-XXX) e token (t) do conteúdo do QR (que é uma URL ?c=CFW-XXX&t=TOKEN)
  function parseQR(raw){
    raw=(raw||'').toString();
    var cod='', tok='';
    var mc=raw.toUpperCase().match(/CFW-?([0-9]+)/);
    if(mc) cod='CFW-'+mc[1];
    var mt=raw.match(/[?&]t=([^&]+)/);
    if(mt) tok=decodeURIComponent(mt[1]);
    return { cod:cod, tok:tok };
  }

  function gotCode(raw){
    if(busy) return;
    var now=Date.now();
    var p=parseQR(raw);
    if(!p.cod){ return; } // ignora QR que não é da casa
    if(p.cod===lastCode && (now-lastT)<3000) return; // debounce
    lastCode=p.cod; lastT=now;
    busy=true; // pausa a leitura até o OK
    if(!p.tok){ showResult({ok:false,erro:'token'}, p.cod); return; }
    setMsg('Registrando '+p.cod+'…','');
    mark(p.cod, p.tok);
  }

  function mark(cod, tok){
    var cb='cb'+Date.now();
    var s=document.createElement('script');
    var done=false;
    window[cb]=function(res){ done=true; showResult(res, cod); cleanup(); };
    function cleanup(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror=function(){ if(!done){ showResult({ok:false,erro:'rede'}, cod); cleanup(); } };
    setTimeout(function(){ if(!done){ showResult({ok:false,erro:'timeout'}, cod); cleanup(); } }, 12000);
    s.src=EXEC+'?action=extmark&cod='+encodeURIComponent(cod)+'&tok='+encodeURIComponent(tok)+'&cb='+cb;
    document.body.appendChild(s);
  }

  function row(cls, ic, lb, vl){
    return '<div class="row '+cls+'"><div class="row__ic">'+ic+'</div><div><div class="row__lb">'+lb+'</div><div class="row__vl">'+vl+'</div></div></div>';
  }

  // Monta e exibe o card que SÓ sai no OK
  function showResult(res, cod){
    var top=$('resTop'), ok = res && res.ok;
    var icon='✓', status='Presença registrada', cls='ok', f=680, d=140;
    if(ok && res.ja){ icon='⚠️'; status='Já estava presente'; cls='warn'; f=440; d=90; }
    else if(!ok){
      cls='err'; icon='✗'; f=180; d=200;
      var e=res && res.erro;
      status = e==='token' ? 'QR inválido' : e==='nao_encontrado' ? 'Reserva não encontrada' : e==='ocupado' ? 'Sistema ocupado' : e==='timeout' ? 'Sem resposta — tente de novo' : 'Falha de conexão';
    }
    top.className='res__top '+cls;
    $('resIcon').textContent=icon;
    $('resStatus').textContent=status;
    $('resHora').textContent = (res && res.hora) ? ('às '+res.hora) : '';
    $('resNome').textContent = (res && res.nome) ? res.nome : (cod||'');
    $('resCod').textContent = cod || '';
    var bd=$('resBday');
    if(res && res.aniversario){ bd.textContent='🎂 HOJE É ANIVERSÁRIO!'+(res.idade?' ('+res.idade+' anos)':''); bd.className='bday on'; if(res.ok){ beep(880,160); setTimeout(function(){beep(1040,200);},180);} }
    else { bd.className='bday'; bd.textContent=''; }
    var rows='';
    if(res && res.sala)    rows+=row('sala','🎭','Sala', res.sala);
    if(res && res.prato)   rows+=row('prato','🍽️','Vai comer', res.prato);
    if(res && res.alergia) rows+=row('alergia','⚠️','Restrição / alergia', res.alergia);
    $('resRows').innerHTML=rows;
    $('res').className='res on';
    beep(f,d);
  }

  function okResult(){
    $('res').className='res';
    busy=false;
    setMsg('Aponte para o QR do convidado','');
    tick(); // retoma a leitura
  }
</script>
</body>
</html>
